[package]
name = "metasafe-desktop"
version = "0.5.0"
edition = "2024"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png"] }
metasafe = { path = "../..", default-features = false }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
