name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundle: macos-arm64
          - os: windows-latest
            bundle: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup update stable
      - run: rustup component add rustfmt clippy --toolchain stable
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - run: cargo +stable build --release --locked
      - name: Package macOS
        if: runner.os == 'macOS' && github.event_name == 'push'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          mkdir -p dist/package
          cp target/release/metasafe target/release/metasafe-gui README.md LICENSE dist/package/
          cp src/bin/gui/fonts/OFL.txt dist/package/Inter-OFL.txt
          ditto -c -k --keepParent dist/package dist/MetaSafe-macos-arm64.zip
      - name: Package Windows
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne "X64") { throw "Expected a Windows x64 runner" }
          New-Item -ItemType Directory -Path dist/package | Out-Null
          Copy-Item -Path @('target/release/metasafe.exe', 'target/release/metasafe-gui.exe', 'README.md', 'LICENSE') -Destination dist/package
          Copy-Item src/bin/gui/fonts/OFL.txt dist/package/Inter-OFL.txt
          Compress-Archive -Path dist/package/* -DestinationPath dist/MetaSafe-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push'
        with:
          name: MetaSafe-${{ matrix.bundle }}
          path: dist/MetaSafe-${{ matrix.bundle }}.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev pkg-config ffmpeg
      - run: rustup update stable
      - run: cargo +stable test --locked --no-default-features
      - run: cargo +stable test --locked --no-default-features --test video_formats -- --ignored
      - run: cargo +stable build --release --locked --no-default-features
      - name: Build Tauri Debian package
        working-directory: desktop
        run: |
          npm ci
          RUSTUP_TOOLCHAIN=stable npm run tauri build -- --bundles deb -- --locked
      - run: cargo +stable test --release --locked --manifest-path desktop/src-tauri/Cargo.toml --features tauri/custom-protocol
      - name: Verify the Linux package
        run: |
          package=$(find desktop/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          test "$(dpkg-deb -f "$package" Architecture)" = amd64
          dpkg-deb -f "$package" Depends | grep -Eq '(^|, )ffmpeg(,|$)'
          dpkg-deb -x "$package" "$RUNNER_TEMP/metasafe-package"
          test -x "$RUNNER_TEMP/metasafe-package/usr/bin/metasafe-desktop"
          ldd "$RUNNER_TEMP/metasafe-package/usr/bin/metasafe-desktop" > "$RUNNER_TEMP/metasafe-ldd.txt"
          if grep 'not found' "$RUNNER_TEMP/metasafe-ldd.txt"; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push'
        with:
          name: MetaSafe-linux-x64
          path: |
            target/release/metasafe
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  windows-desktop:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Build Windows desktop installer
        working-directory: desktop
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run tauri build -- --bundles nsis -- --locked
      - name: Install and launch the Windows desktop package
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if (@($installer).Count -ne 1) { throw 'Expected exactly one NSIS package' }
          $installDir = Join-Path $env:RUNNER_TEMP 'MetaSafe'
          # NSIS requires the unquoted /D= argument to be last.
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installDir" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Installer exited with $($setup.ExitCode)" }
          $installedApp = Join-Path $installDir 'metasafe-desktop.exe'
          if (!(Test-Path -LiteralPath $installedApp -PathType Leaf)) { throw "Installed application missing at $installedApp" }
          $process = Start-Process -FilePath $installedApp -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              $process.Refresh()
              if ($process.HasExited) { throw "MetaSafe exited with $($process.ExitCode)" }
              if ($process.MainWindowHandle -ne [IntPtr]::Zero -and $process.MainWindowTitle -eq 'MetaSafe') { break }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            if ($process.MainWindowTitle -ne 'MetaSafe') { throw 'MetaSafe window did not appear' }
            Write-Host 'The installed MetaSafe desktop application opened its main window.'
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MetaSafe-Windows-desktop-x64
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
